# Tests get their own throwaway database so they never touch database/app.db
# and do not depend on the working directory the build happens to run from.
#
# SQLite gives each connection its own in-memory database, so the shared cache
# plus a single pooled connection is what keeps the schema visible across the test.
spring.datasource.url=jdbc:sqlite:file:testdb?mode=memory&cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

app.jwt.secret=dGVzdC1zZWNyZXQtZm9yLXVuaXQtdGVzdHMtb25seS1ub3QtYS1yZWFsLWtleQ==
app.jwt.expiration-ms=3600000
